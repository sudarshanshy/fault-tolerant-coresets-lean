<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fault-tolerant coresets · Proof graph</title>
<style>
:root { font-family: system-ui, sans-serif; color: #252a27; background: #fff; }
* { box-sizing: border-box; }
body { margin: 0; height: 100dvh; display: flex; flex-direction: column; }
button, input, select { font: inherit; font-size: 13px; color: inherit; }
button, select, input { background: #fff; border: 1px solid #e0e4e1; border-radius: 5px; padding: 8px 10px; }
button, select, summary { cursor: pointer; }
button:hover { background: #f4f6f4; }
:focus-visible { outline: 2px solid #507b60; outline-offset: 3px; }
header { display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-bottom: 1px solid #eceeec; }
h1 { font-size: 15px; font-weight: 600; margin: 0 auto 0 0; white-space: nowrap; }
#searchwrap { position: relative; }
#search { width: 210px; }
#results { position: absolute; z-index: 3; right: 0; top: calc(100% + 6px); width: 320px; max-width: calc(100vw - 32px); max-height: 320px; overflow: auto; background: white; border: 1px solid #e0e4e1; border-radius: 6px; padding: 10px; box-shadow: 0 8px 24px #0000000a; }
main { flex: 1; min-height: 0; display: flex; position: relative; }
#graph { position: relative; flex: 1; min-width: 0; }
#canvas { position: absolute; inset: 16px 16px 54px; overflow: hidden; touch-action: none; cursor: grab; }
#canvas:active { cursor: grabbing; }
#canvas > svg { width: 100%; height: 100%; display: block; }
g.node { cursor: pointer; }
g.node ellipse, g.node polygon { fill: #f7f9f7; stroke: #9ba99f; }
g.node text { fill: #35433a; }
g.node.main ellipse, g.node.main polygon { fill: #e8f0e9; stroke: #698671; }
g.node:hover ellipse, g.node:hover polygon, g.node.active ellipse, g.node.active polygon { fill: #e1eee3; stroke: #315e3e; stroke-width: 2; }
g.edge path { stroke: #bac3bd; }
g.edge polygon { stroke: #bac3bd; fill: #bac3bd; }
.graph-footer { position: absolute; bottom: 14px; left: 20px; right: 20px; display: flex; gap: 12px; align-items: center; justify-content: space-between; }
.hint { font-size: 12px; color: #7b827d; margin: 0; }
.zoom { display: flex; gap: 4px; }
.zoom button { min-width: 32px; padding: 6px 9px; }
aside { width: 380px; flex-shrink: 0; border-left: 1px solid #eceeec; padding: 20px; overflow: auto; }
[hidden] { display: none !important; }
.panel-heading { display: flex; gap: 12px; align-items: flex-start; }
h2 { margin: 0; font-size: 17px; font-weight: 600; line-height: 1.4; flex: 1; }
#close { border: 0; padding: 0 4px; color: #818780; font-size: 22px; line-height: 1; }
h3 { font-size: 12px; font-weight: 600; margin: 24px 0 10px; }
.meta { font-size: 11px; color: #7b827d; overflow-wrap: anywhere; line-height: 1.6; margin: 10px 0; }
pre { font: 12px/1.65 ui-monospace, SFMono-Regular, monospace; white-space: pre-wrap; overflow-wrap: anywhere; background: #f7f8f7; padding: 12px; border-radius: 5px; margin: 10px 0 0; }
.link { display: block; width: 100%; text-align: left; border: 0; padding: 6px 0; color: #40684c; overflow-wrap: anywhere; line-height: 1.5; }
.link:hover { background: transparent; text-decoration: underline; }
details { margin-top: 24px; }
summary { font-size: 13px; }
#node-tooltip { position: fixed; z-index: 10; width: 360px; max-width: calc(100vw - 24px); padding: 17px 19px; border: 1px solid #dce3de; border-radius: 9px; background: #fff; color: #263a2d; box-shadow: 0 8px 30px #142d1b20; }
#node-tooltip strong { display: block; font-size: 20px; font-weight: 600; line-height: 1.35; overflow-wrap: anywhere; }
#node-tooltip p { font-size: 17px; line-height: 1.5; margin: 9px 0 0; }
@media (max-width: 700px) {
  header { flex-wrap: wrap; padding: 12px 16px; gap: 10px; }
  h1 { width: 100%; }
  #view { flex: 1; min-width: 0; }
  #searchwrap { flex: 1; min-width: 0; }
  #search { width: 100%; }
  aside { position: absolute; z-index: 2; bottom: 0; width: 100%; max-height: 60%; border: 1px solid #e0e4e1; border-radius: 10px 10px 0 0; background: white; box-shadow: 0 -4px 20px #00000008; }
  .hint { max-width: 180px; line-height: 1.5; }
}
</style>
</head>
<body>
<header>
  <h1>Fault-tolerant coresets · Proof graph</h1>
  <select id="view" aria-label="Proof view"></select>
  <div id="searchwrap">
    <input id="search" placeholder="Find a theorem or lemma" aria-label="Search declarations" autocomplete="off">
    <div id="results" hidden></div>
  </div>
</header>
<main>
  <div id="graph">
    <div id="canvas" aria-label="Interactive dependency graph"></div>
    <div class="graph-footer">
      <p class="hint">Hover for a summary · Click for the proof</p>
      <div class="zoom">
        <button id="zoomout" aria-label="Zoom out">−</button>
        <button id="zoomin" aria-label="Zoom in">+</button>
        <button id="reset">Fit</button>
      </div>
    </div>
  </div>
  <aside id="details" aria-label="Selected declaration" hidden></aside>
</main>
<div id="node-tooltip" role="tooltip" hidden><strong id="tooltip-title"></strong><p id="tooltip-summary"></p></div>
<script>
const DATA=__GRAPH_DATA__;
const $=id=>document.getElementById(id);
let current='overview',selected=null,svg=null,base=null,box=null,drag=null;
let tooltipNode=null,tooltipTimer=null;
const make=(tag,text,cls)=>{const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e};
const titles={overview:'Overview',deterministic:'Theorem 1.1',stochastic:'Theorem 1.2',lower:'Theorem 1.3',full:'All declarations'};
for(const [key,v] of Object.entries(DATA.views)){
  const op=make('option',titles[key]||v.title);op.value=key;$('view').append(op);
}
function hideTooltip(){
  clearTimeout(tooltipTimer);
  if(tooltipNode)tooltipNode.removeAttribute('aria-describedby');
  tooltipNode=null;$('node-tooltip').hidden=true;
}
function scheduleTooltipHide(){clearTimeout(tooltipTimer);tooltipTimer=setTimeout(hideTooltip,160)}
function showTooltip(node){
  hideTooltip();tooltipNode=node;
  const data=DATA.nodes[node.id],tip=$('node-tooltip');
  $('tooltip-title').textContent=data.label.replace(/\n/g,' ');
  $('tooltip-summary').textContent=data.summary;
  node.setAttribute('aria-describedby','node-tooltip');
  tip.hidden=false;
  const rect=node.getBoundingClientRect(),gap=12,margin=12;
  const width=tip.offsetWidth,height=tip.offsetHeight;
  const left=Math.max(margin,Math.min(rect.left+rect.width/2-width/2,window.innerWidth-width-margin));
  let top=rect.top-height-gap;
  if(top<margin)top=rect.bottom+gap;
  top=Math.max(margin,Math.min(top,window.innerHeight-height-margin));
  tip.style.left=left+'px';tip.style.top=top+'px';
}
$('node-tooltip').onpointerenter=()=>clearTimeout(tooltipTimer);
$('node-tooltip').onpointerleave=scheduleTooltipHide;
window.addEventListener('resize',hideTooltip);
window.addEventListener('scroll',hideTooltip,true);
function applyBox(){hideTooltip();svg.setAttribute('viewBox',box.join(' '))}
function fit(){box=[...base];applyBox()}
function zoom(factor,x=.5,y=.5){const [a,b,w,h]=box;box=[a+w*x*(1-factor),b+h*y*(1-factor),w*factor,h*factor];applyBox()}
function highlight(){svg.querySelectorAll('g.node').forEach(g=>g.classList.toggle('active',g.id===selected))}
function closeDetails(){hideTooltip();selected=null;$('details').hidden=true;highlight()}
function showView(key){
  hideTooltip();
  current=key;$('view').value=key;
  $('canvas').innerHTML=DATA.views[key].svg;
  svg=$('canvas').querySelector('svg');
  base=svg.getAttribute('viewBox').split(/\s+/).map(Number);box=[...base];
  svg.removeAttribute('width');svg.removeAttribute('height');
  svg.querySelectorAll('g.node').forEach(g=>{
    g.classList.toggle('main',DATA.main.includes(g.id));
    g.setAttribute('tabindex','0');g.setAttribute('role','button');
    g.setAttribute('aria-label',DATA.nodes[g.id].label.replace(/\n/g,' '));
    g.querySelectorAll('title').forEach(title=>title.remove());
    g.querySelectorAll('a').forEach(a=>{a.removeAttribute('title');a.removeAttributeNS('http://www.w3.org/1999/xlink','title')});
    g.onpointerenter=e=>{if(e.pointerType!=='touch'&&!drag)showTooltip(g)};
    g.onpointerleave=scheduleTooltipHide;
    g.onfocus=()=>showTooltip(g);
    g.onblur=scheduleTooltipHide;
    g.onclick=e=>{e.stopPropagation();selectNode(g.id)};
    g.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selectNode(g.id)}};
  });
  applyBox();highlight();
}
function addLink(parent,id){
  const n=DATA.nodes[id],b=make('button',n.label.replace(/\n/g,' '),'link');
  b.onclick=()=>selectNode(id);parent.append(b);
}
function selectNode(id){
  hideTooltip();
  if(!DATA.nodes[id])return;
  selected=id;
  if(!DATA.views[current].nodes.includes(id))showView(Object.keys(DATA.views).find(key=>DATA.views[key].nodes.includes(id))||'full');
  highlight();
  const n=DATA.nodes[id],panel=$('details');panel.hidden=false;
  const heading=make('div',undefined,'panel-heading');
  const close=make('button','×');close.id='close';close.setAttribute('aria-label','Close details');close.onclick=closeDetails;
  heading.append(make('h2',n.label.replace(/\n/g,' ')),close);
  panel.replaceChildren(heading,make('p',n.name+' · '+n.file+':'+n.line,'meta'),make('pre',n.statement||'(See source declaration.)'));
  const source=make('details');source.append(make('summary','Lean proof'),make('pre',n.source));panel.append(source);
  const edges=DATA.views[current].edges;
  for(const [title,list,field] of [['Depends on',edges.filter(e=>e.to===id),'from'],['Used by',edges.filter(e=>e.from===id),'to']]){
    if(!list.length)continue;
    panel.append(make('h3',title));for(const e of list)addLink(panel,e[field]);
  }
  panel.scrollTop=0;$('search').value='';$('results').hidden=true;
}
$('view').onchange=e=>{closeDetails();showView(e.target.value)};
$('reset').onclick=fit;$('zoomin').onclick=()=>zoom(.8);$('zoomout').onclick=()=>zoom(1.25);
$('canvas').addEventListener('wheel',e=>{
  e.preventDefault();const r=$('canvas').getBoundingClientRect();
  zoom(e.deltaY>0?1.12:1/1.12,(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height);
},{passive:false});
$('canvas').addEventListener('pointerdown',e=>{
  hideTooltip();
  if(e.target.closest('g.node'))return;
  drag={x:e.clientX,y:e.clientY,box:[...box]};$('canvas').setPointerCapture(e.pointerId);
});
$('canvas').addEventListener('pointermove',e=>{
  if(!drag)return;const r=$('canvas').getBoundingClientRect();
  box=[drag.box[0]-(e.clientX-drag.x)*drag.box[2]/r.width,drag.box[1]-(e.clientY-drag.y)*drag.box[3]/r.height,drag.box[2],drag.box[3]];applyBox();
});
$('canvas').addEventListener('pointerup',()=>drag=null);
$('canvas').addEventListener('pointercancel',()=>drag=null);
$('search').oninput=e=>{
  const q=e.target.value.trim().toLowerCase(),results=$('results');results.replaceChildren();results.hidden=!q;if(!q)return;
  const hits=Object.values(DATA.nodes).filter(n=>(n.name+' '+n.label).toLowerCase().includes(q)).slice(0,25);
  for(const n of hits)addLink(results,n.id);
  if(!hits.length)results.append(make('p','No matching declaration.','meta'));
};
document.addEventListener('click',e=>{if(!e.target.closest('#searchwrap'))$('results').hidden=true});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDetails();$('results').hidden=true}});
showView('overview');
</script>
</body>
</html>
